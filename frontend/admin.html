<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="席間訂單管理後台">
    <title>訂單管理｜席間</title>
    <link rel="stylesheet" href="/frontend/design-system.css?v=20260811-1">
    <link rel="stylesheet" href="/frontend/navigation.css?v=20260811-3">
    <link rel="stylesheet" href="./admin.css">
    <link rel="stylesheet" href="/frontend/brand-pages.css?v=20260811-1">
    <script src="./admin.js" defer></script>
  </head>
  <body>
    <nav class="top-home-nav" aria-label="主要導覽"><a class="top-home-brand" href="/" aria-label="席間首頁"><span class="top-home-brand-mark" aria-hidden="true">席</span><span class="top-home-brand-name">席間<small>MENU · ORDER · TOGETHER</small></span></a></nav>
    <header class="admin-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">店家管理</p>
          <h1>訂單管理</h1>
          <p id="order-summary" class="header-note">訂單載入中</p>
        </div>
        <a class="ordering-link" href="/frontend/">返回點餐頁</a>
      </div>
    </header>

    <main class="admin-main">
      <div id="orders-status" class="status-panel" role="status" aria-live="polite">
        <span class="loading-dot" aria-hidden="true"></span>
        <span>訂單載入中</span>
      </div>
      <section id="orders-list" class="orders-list" aria-label="訂單列表"></section>
    </main>

    <footer class="admin-footer">
      <p>訂單依建立時間由新到舊排列</p>
    </footer>
  </body>
</html>
