<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="輸入團購代碼並查看本次團購菜單">
    <title>加入團購｜席間</title>
    <link rel="stylesheet" href="/frontend/design-system.css?v=20260811-1">
    <link rel="stylesheet" href="/frontend/navigation.css?v=20260811-3">
    <link rel="stylesheet" href="/frontend/group.css?v=20260819-3">
    <link rel="stylesheet" href="/frontend/brand-pages.css?v=20260811-1">
    <script src="/frontend/menu-variants.js?v=20260808-1" defer></script>
    <script src="/frontend/auth.js?v=20260811-1" type="module"></script>
    <script src="/frontend/group.js?v=20260819-3" defer></script>
  </head>
  <body>
    <nav class="top-home-nav" aria-label="主要導覽"><a class="top-home-brand" href="/" aria-label="席間首頁"><span class="top-home-brand-mark" aria-hidden="true">席</span><span class="top-home-brand-name">席間<small>MENU · ORDER · TOGETHER</small></span></a></nav>
    <header class="site-header">
      <div class="header-inner">
        <p class="eyebrow">一起點餐</p>
        <h1>加入團購</h1>
        <p>輸入統籌分享的 6 碼代碼，即可查看這次的菜單。</p>
      </div>
    </header>

    <main class="page-shell">
      <section class="code-panel" aria-labelledby="code-title">
        <h2 id="code-title">團購代碼</h2>
        <form id="code-form" novalidate>
          <label for="group-code">請輸入 6 碼代碼</label>
          <div class="code-entry">
            <input
              id="group-code"
              name="group-code"
              type="text"
              inputmode="text"
              autocomplete="off"
              maxlength="6"
              aria-describedby="code-status"
              required
            >
            <button type="submit">進入團購</button>
          </div>
          <p id="code-status" class="status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>

      <section id="menu-section" class="menu-section" aria-labelledby="restaurant-name" hidden>
        <div class="menu-heading">
          <p id="group-label"></p>
          <h2 id="restaurant-name"></h2>
        </div>
        <p id="group-state" class="group-state" role="status" hidden></p>
        <div class="ordering-layout">
          <div>
            <div id="menu-content"></div>
            <p id="empty-menu" class="empty-menu" hidden>目前沒有可顯示的餐點</p>
          </div>

          <aside id="cart-panel" class="cart-panel" aria-labelledby="cart-title" hidden>
            <h3 id="cart-title">你的訂單</h3>
            <p id="cart-empty" class="cart-empty">尚未選擇餐點</p>
            <ul id="cart-items" class="cart-items" aria-live="polite"></ul>
            <div class="cart-total">
              <span>總金額</span>
              <strong id="cart-total">NT$ 0</strong>
            </div>
            <form id="order-form" novalidate>
              <label for="customer-name">取餐姓名</label>
              <input
                id="customer-name"
                name="customer-name"
                type="text"
                autocomplete="name"
                maxlength="50"
                placeholder="請輸入姓名"
                required
              >
              <div class="order-identity-panel">
                <p id="account-identity" class="account-identity" hidden></p>
                <div id="guest-identity-fields" class="guest-identity-fields">
                  <p class="identity-title">未登入訪客身分</p>
                  <label for="contact-method">聯絡方式</label>
                  <select id="contact-method" name="contact-method">
                    <option value="phone">手機號碼</option>
                    <option value="email">Email</option>
                  </select>
                  <label id="contact-value-label" for="contact-value">手機號碼</label>
                  <input
                    id="contact-value"
                    name="contact-value"
                    type="tel"
                    inputmode="tel"
                    autocomplete="tel"
                    maxlength="254"
                    placeholder="例如：0912345678"
                  >
                  <small>僅供統籌辨識訂購者，不會顯示在公開菜單。</small>
                  <label for="edit-code">6 碼訂單修改碼</label>
                  <input
                    id="edit-code"
                    name="edit-code"
                    type="password"
                    inputmode="numeric"
                    autocomplete="off"
                    minlength="6"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="請設定 6 碼數字"
                  >
                  <small>
                    第一次送單請自行設定；之後換手機或瀏覽器時，可用同一聯絡方式與修改碼找回原訂單。
                  </small>
                  <button id="recover-order" class="recover-order-button" type="button">
                    載入並修改原訂單
                  </button>
                </div>
              </div>
              <label class="order-honeypot" aria-hidden="true">
                網站
                <input
                  id="order-website"
                  name="website"
                  type="text"
                  autocomplete="off"
                  tabindex="-1"
                >
              </label>
              <button id="submit-order" type="submit" disabled>送出訂單</button>
              <p id="order-status" class="status" role="status" aria-live="polite" hidden></p>
            </form>
          </aside>
        </div>
      </section>

      <dialog id="repeat-order-dialog" class="repeat-order-dialog" aria-labelledby="repeat-order-title">
        <form method="dialog">
          <p class="eyebrow">已找到你的原訂單</p>
          <h2 id="repeat-order-title">這次要加購，還是修改？</h2>
          <p>
            訂單 <strong id="repeat-order-number"></strong> 會保留原編號，
            不會再建立第二張訂單。
          </p>
          <div class="repeat-order-actions">
            <button type="submit" value="add">加購到原訂單</button>
            <button type="submit" value="replace">用這次內容取代</button>
            <button class="secondary" type="submit" value="cancel">先不要送出</button>
          </div>
          <small>「加購」會累加數量；「取代」會以目前購物車內容更新原訂單。</small>
        </form>
      </dialog>
    </main>
  </body>
</html>
