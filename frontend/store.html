<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="店家固定線上菜單">
    <title>店家菜單｜席間</title>
    <link rel="stylesheet" href="/frontend/design-system.css?v=20260811-1">
    <link rel="stylesheet" href="/frontend/navigation.css?v=20260811-3">
    <link rel="stylesheet" href="/frontend/store.css?v=20260819-2">
    <link rel="stylesheet" href="/frontend/brand-pages.css?v=20260811-1">
    <script src="/frontend/menu-variants.js?v=20260808-1" defer></script>
    <script src="/frontend/auth.js?v=20260811-1" type="module"></script>
    <script src="/frontend/store.js?v=20260819-2" defer></script>
  </head>
  <body>
    <nav class="top-home-nav" aria-label="主要導覽"><a class="top-home-brand" href="/" aria-label="席間首頁"><span class="top-home-brand-mark" aria-hidden="true">席</span><span class="top-home-brand-name">席間<small>MENU · ORDER · TOGETHER</small></span></a></nav>
    <header class="site-header">
      <div class="header-inner">
        <p class="eyebrow">店家線上菜單</p>
        <h1 id="restaurant-name">菜單載入中</h1>
        <p>固定網址會顯示店家目前供應的菜單。</p>
      </div>
    </header>

    <main class="page-shell">
      <p id="store-status" class="status" role="status" aria-live="polite">菜單載入中</p>

      <div id="store-content" class="store-layout" hidden>
        <section aria-label="店家菜單">
          <p id="service-state" class="service-state"></p>
          <div id="menu-content"></div>
          <p id="empty-menu" class="empty-menu" hidden>目前沒有可顯示的餐點</p>
        </section>

        <div class="side-column">
          <aside id="cart-panel" class="cart-panel" aria-labelledby="cart-title">
            <h2 id="cart-title">我的餐點</h2>
            <p id="cart-empty">尚未選擇餐點</p>
            <ul id="cart-items" class="cart-items"></ul>
            <div class="cart-total">
              <span>總金額</span>
              <strong id="cart-total">NT$ 0</strong>
            </div>
            <form id="order-form">
              <label for="customer-name">取餐姓名</label>
              <input id="customer-name" name="customer-name" maxlength="50" autocomplete="name" required>
              <div class="order-identity-panel">
                <p id="account-identity" class="account-identity" hidden></p>
                <div id="guest-identity-fields" class="guest-identity-fields">
                  <p class="identity-title">未登入訪客身分</p>
                  <label for="contact-method">聯絡方式</label>
                  <select id="contact-method" name="contact-method">
                    <option value="phone">手機號碼</option>
                    <option value="email">Email</option>
                  </select>
                  <label id="contact-value-label" for="contact-value">手機號碼</label>
                  <input id="contact-value" name="contact-value" type="tel" inputmode="tel" autocomplete="tel" maxlength="254" placeholder="例如：0912345678">
                  <small>僅供店家辨識訂購者，不會顯示在公開菜單。</small>
                </div>
              </div>
              <label class="order-honeypot" aria-hidden="true">
                網站
                <input
                  id="order-website"
                  name="website"
                  type="text"
                  autocomplete="off"
                  tabindex="-1"
                >
              </label>
              <button id="submit-order" type="submit" disabled>送出訂單</button>
            </form>
            <p id="order-status" class="order-status" role="status" aria-live="polite" hidden></p>
          </aside>

          <aside class="qr-panel" aria-labelledby="qr-title">
            <h2 id="qr-title">分享這家店</h2>
            <img id="store-qr" alt="店家固定菜單 QR Code">
            <p>此 QR Code 只包含公開菜單網址，不含店家管理權限。</p>
            <a id="public-link">開啟固定菜單網址</a>
          </aside>
        </div>
      </div>
    </main>
  </body>
</html>
