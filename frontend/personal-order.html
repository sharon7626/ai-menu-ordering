<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="查看自己的個人訂單">
    <title>我的訂單｜席間</title>
    <link rel="stylesheet" href="/frontend/design-system.css?v=20260811-1">
    <link rel="stylesheet" href="/frontend/navigation.css?v=20260811-3">
    <link rel="stylesheet" href="/frontend/personal-order.css">
    <link rel="stylesheet" href="/frontend/brand-pages.css?v=20260811-1">
    <script src="/frontend/auth.js?v=20260811-1" type="module"></script>
    <script src="/frontend/personal-order.js?v=20260811-2" type="module"></script>
  </head>
  <body>
    <nav class="top-home-nav" aria-label="主要導覽"><a class="top-home-brand" href="/" aria-label="席間首頁"><span class="top-home-brand-mark" aria-hidden="true">席</span><span class="top-home-brand-name">席間<small>MENU · ORDER · TOGETHER</small></span></a></nav>
    <header class="site-header">
      <div class="header-inner">
        <p id="order-mode-label">個人訂單</p>
        <h1>我的訂單</h1>
      </div>
    </header>

    <main class="page-shell">
      <p id="order-status" class="status" role="status" aria-live="polite">訂單載入中</p>

      <article id="order-card" class="order-card" hidden>
        <div class="order-heading">
          <p id="restaurant-name"></p>
          <h2 id="order-number"></h2>
          <p>取餐姓名：<strong id="customer-name"></strong></p>
        </div>
        <ul id="order-items" class="order-items"></ul>
        <div class="order-total">
          <span>總金額</span>
          <strong id="total-amount"></strong>
        </div>
        <p id="created-at" class="created-at"></p>
        <button id="claim-order" type="button" hidden>保存到我的訂單</button>
        <a id="back-to-group" class="back-link">返回菜單</a>
      </article>
    </main>
  </body>
</html>
